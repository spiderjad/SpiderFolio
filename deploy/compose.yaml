# SpiderFolio on your own server (docs/install/README.md · docs/instalacion/README.md).
#
#   ./setup.sh  (Linux)  ·  .\setup.ps1  (Windows)   # writes .env
#   docker compose up -d                              # db, app, worker; migrations run on start
#
# Optional profiles (set COMPOSE_PROFILES in .env, comma-separated):
#   https  Caddy with automatic HTTPS for DOMAIN (ports 80 and 443)
#   pdf    Gotenberg: PDF of controlled documents (needs GOTENBERG_URL=http://gotenberg:3000)
#   mail   Mailpit: test inbox at http://localhost:8025, no real email server (SMTP_HOST=mailpit)
#
# Update: docker compose pull && docker compose up -d (docs/instalacion/actualizar.md).

name: spiderfolio

x-app: &app
  image: ${SPIDERFOLIO_IMAGE:-ghcr.io/spiderjad/spiderfolio:latest}
  env_file: .env
  environment:
    NODE_ENV: production
    PORT: "4000"
    DATABASE_URL: postgres://${POSTGRES_USER:-spiderfolio}:${POSTGRES_PASSWORD:?Completa POSTGRES_PASSWORD en .env / Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-spiderfolio}
    STORAGE_DIR: /data/files
    GOTENBERG_URL: ${GOTENBERG_URL:-}
  volumes:
    - files:/data/files
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  db:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spiderfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Completa POSTGRES_PASSWORD en .env / Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-spiderfolio}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spiderfolio} -d ${POSTGRES_DB:-spiderfolio}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # API and app. On start it applies pending migrations (core and plugins).
  app:
    <<: *app
    # docker compose build: builds the image from source (with the plugins in plugins/) and tags it
    # as SPIDERFOLIO_IMAGE; the worker uses the same one.
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      db: { condition: service_healthy }
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:4000"

  # Queues and scheduled jobs (emails, PDFs, search, trash…). Starts once the API has migrated.
  worker:
    <<: *app
    command: ["node", "backend/src/worker.ts"]
    depends_on:
      app: { condition: service_healthy }
    healthcheck:
      disable: true

  caddy:
    image: caddy:2.10.2-alpine
    profiles: ["https"]
    # Compose interpolates the whole file even for inactive profiles, so DOMAIN can't use ${DOMAIN:?}:
    # it would be required without the https profile too. It's checked here, when Caddy starts.
    environment:
      DOMAIN: ${DOMAIN:-}
    entrypoint:
      - sh
      - -c
      - '[ -n "$$DOMAIN" ] || { echo "Con el perfil https, completa DOMAIN en .env / With the https profile, set DOMAIN in .env" >&2; exit 1; }; exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile'
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

  gotenberg:
    image: gotenberg/gotenberg:8.38.0
    profiles: ["pdf"]
    restart: unless-stopped

  # Test inbox: catches every email (nothing leaves the machine). Only for trying SpiderFolio out.
  mailpit:
    image: axllent/mailpit:v1.31.5
    profiles: ["mail"]
    ports:
      - "127.0.0.1:${MAIL_UI_PORT:-8025}:8025"
    restart: unless-stopped

volumes:
  db-data:
  files:
  caddy-data:
  caddy-config:
