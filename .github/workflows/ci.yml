# Verificaciones del repositorio. El paso de secretos corre lo mismo que el hook pre-commit, pero sobre
# todos los archivos versionados: si alguien se salta el hook (--no-verify) o commitea sin él, falla acá.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Ningún archivo versionado con forma de secreto
        run: node scripts/check-secrets.ts
      - name: .env.example con los secretos vacíos
        run: npx vitest run tests/env-example.test.ts

  typecheck:
    name: Tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The Prisma client isn't versioned: generating it needs the schema only, not a database.
      - name: Cliente de Prisma
        run: npm run db:generate -w @spiderfolio/backend
      - name: TypeScript en todo el monorepo
        run: npm run typecheck

  readme-links:
    name: Enlaces de los README
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Imágenes y enlaces locales que existen en el repositorio
        run: node scripts/check-readme-links.ts
