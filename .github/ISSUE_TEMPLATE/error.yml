name: Reportar un error
description: Algo no funciona como debería.
labels: ["error"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportarlo. Si es una vulnerabilidad de seguridad, **no** la publiques acá: sigue SECURITY.md.
  - type: textarea
    id: que-paso
    attributes:
      label: Qué pasó
      description: Qué hiciste, qué esperabas y qué pasó en cambio.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Cómo reproducirlo
      placeholder: |
        1. Ir a…
        2. Hacer clic en…
        3. Ver el error…
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión de SpiderFolio
      placeholder: "ej. 1.2.0 o el commit"
    validations:
      required: true
  - type: dropdown
    id: instalacion
    attributes:
      label: Instalación
      options:
        - Docker (deploy/compose.yaml)
        - Desde el código (npm run dev)
        - Otra
    validations:
      required: true
  - type: input
    id: navegador
    attributes:
      label: Navegador y sistema
      placeholder: "ej. Chrome 140 en Windows 11"
  - type: textarea
    id: logs
    attributes:
      label: Registros
      description: La salida de `docker compose logs app worker` alrededor del error, sin secretos ni datos personales.
      render: shell
