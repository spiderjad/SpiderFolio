# Development services. The API, the app and the website run outside Docker (npm run dev).
# Needs a .env (copied from .env.example) with S3_ACCESS_KEY and S3_SECRET_KEY filled in.
# Ports are published on 127.0.0.1 only.

# Its own project name: "spiderfolio" is the self-hosted installation (deploy/compose.yaml), and
# sharing it made each one recreate the other's containers on the same machine.
name: spiderfolio-dev

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: spiderfolio
      POSTGRES_PASSWORD: spiderfolio
      POSTGRES_DB: spiderfolio
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spiderfolio -d spiderfolio"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.5
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # web UI

  rustfs:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?Completá S3_ACCESS_KEY en .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?Completá S3_SECRET_KEY en .env}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
    ports:
      - "127.0.0.1:9000:9000" # API S3
      - "127.0.0.1:9001:9001" # console
    volumes:
      - rustfs-data:/data

  # Creates the private bucket and its CORS; idempotent, exits when done.
  rustfs-init:
    image: amazon/aws-cli:2.38.1
    depends_on:
      - rustfs
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Completá S3_ACCESS_KEY en .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Completá S3_SECRET_KEY en .env}
      AWS_DEFAULT_REGION: us-east-1
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      BUCKET: ${S3_BUCKET:-spiderfolio-files}
      SYSTEM_BUCKET: ${S3_SYSTEM_BUCKET:-${S3_BUCKET:-spiderfolio-files}-system}
      CORS: >-
        {"CORSRules":[{"AllowedOrigins":["${APP_URL:-http://localhost:5173}"],
        "AllowedMethods":["GET","PUT","HEAD"],"AllowedHeaders":["*"],
        "ExposeHeaders":["ETag"],"MaxAgeSeconds":3600}]}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        s3="aws --endpoint-url http://rustfs:9000 s3api"
        tries=0
        until $$s3 list-buckets > /dev/null 2>&1; do
          tries=$$((tries + 1))
          if [ "$$tries" -ge 30 ]; then echo "RustFS no respondió" >&2; exit 1; fi
          sleep 1
        done
        $$s3 head-bucket --bucket "$$BUCKET" 2> /dev/null || $$s3 create-bucket --bucket "$$BUCKET"
        $$s3 put-bucket-cors --bucket "$$BUCKET" --cors-configuration "$$CORS"
        echo "Bucket $$BUCKET listo"
        $$s3 head-bucket --bucket "$$SYSTEM_BUCKET" 2> /dev/null || $$s3 create-bucket --bucket "$$SYSTEM_BUCKET"
        echo "Bucket de sistema $$SYSTEM_BUCKET listo"
    restart: "no"

  # HTML → PDF for the controlled PDF. On 127.0.0.1 in development; no ports in production.
  gotenberg:
    image: gotenberg/gotenberg:8.38.0
    ports:
      - "127.0.0.1:3000:3000"

# Explicit names: the volumes keep the names they had under the old "spiderfolio" project, so
# existing development data stays.
volumes:
  postgres-data:
    name: spiderfolio_postgres-data
  rustfs-data:
    name: spiderfolio_rustfs-data
